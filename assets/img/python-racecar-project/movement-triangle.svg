<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 260" width="470" height="260" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <title>Splitting the car's movement into across and down</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="part" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d95"/>
    </marker>
  </defs>
  <rect width="470" height="260" rx="12" fill="#fff"/>
  <!-- Across and down -->
  <g stroke="#2f7d95" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#part)">
    <line x1="60" y1="50" x2="320" y2="50"/>
    <line x1="330" y1="50" x2="330" y2="195"/>
  </g>
  <text x="190" y="36" fill="#2f7d95" text-anchor="middle" font-weight="bold">across (movement.x)</text>
  <text x="342" y="120" fill="#2f7d95" font-weight="bold">down</text>
  <text x="342" y="140" fill="#2f7d95" font-weight="bold">(movement.y)</text>
  <!-- Right angle -->
  <path d="M 316 50 L 316 64 L 330 64" fill="none" stroke="#2f7d95" stroke-width="2"/>
  <!-- Movement -->
  <line x1="60" y1="50" x2="320" y2="200" stroke="#333" stroke-width="4" marker-end="url(#head)"/>
  <text x="150" y="160" fill="#333" font-weight="bold" transform="rotate(30 150 160)">movement (speed)</text>
  <!-- Angle -->
  <path d="M 120 50 A 60 60 0 0 1 112 80" fill="none" stroke="#333" stroke-width="2"/>
  <text x="128" y="78" fill="#333">angle</text>
  <!-- Car -->
  <g transform="rotate(30 60 50)">
    <rect x="30" y="38" width="44" height="24" rx="6" fill="#2e9e3e" stroke="#1d6b28" stroke-width="2"/>
    <rect x="54" y="42" width="9" height="16" rx="2" fill="#cfe8f5"/>
  </g>
</svg>
